name: ci

on:
  push:
    branches:
      - main
  # No branch filter: the lint wave stacks pull requests on top of one another,
  # and filtering on `main` left every intermediate step ungated -- only the
  # secret scanner ran.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Before setup-node: `cache: pnpm` needs a pnpm on PATH to locate the
      # store. The version comes from the root `packageManager` field.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/dms-builder/frontend-vue/pnpm-lock.yaml

      # `...` pulls in the workspace interface package the runtime depends on;
      # `{.}` adds the root, which owns the shared lint and format tooling.
      - run: pnpm install --filter "@antelopejs/dms-builder..." --filter "{.}" --frozen-lockfile
      - run: pnpm --dir packages/dms-builder/frontend-vue install --frozen-lockfile

      - run: pnpm --filter @antelopejs/interface-dms-builder build
      - run: pnpm --filter @antelopejs/interface-dms-builder typecheck

      - run: pnpm --filter @antelopejs/dms-builder test:package-contract
      # `prepack` runs the build, so this also gates on compile errors.
      - run: pnpm --filter @antelopejs/dms-builder prepack
      - run: pnpm --filter @antelopejs/dms-builder test:builder-enabled
      - run: pnpm --filter @antelopejs/dms-builder test:query-templates
      - run: pnpm --filter @antelopejs/dms-builder test:frontend-registration

      - run: pnpm --dir packages/dms-builder/frontend-vue typecheck
      - run: pnpm --dir packages/dms-builder/frontend-vue lint
      - run: pnpm --dir packages/dms-builder/frontend-vue test

      # Lint and format are shared configs owned by the workspace root.
      - run: pnpm lint
      # oxlint's type-aware pass degrades to `any` on a broken tsconfig
      # without failing, so the typecheck is what catches it.
      - run: pnpm --filter @antelopejs/dms-builder typecheck
      - run: pnpm --filter @antelopejs/dms-builder knip
