name: ci

on:
  push:
    branches:
      - main
  # No branch filter: the lint wave stacks pull requests on top of one another,
  # and filtering on `main` left every intermediate step ungated -- only the
  # secret scanner ran.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Independent jobs instead of one sequence: the wall-clock is the slowest of
# them, not their sum.
jobs:
  # `pnpm run checks`: typecheck, lint (oxlint and the Vue layer's ESLint),
  # format, knip, the node, Vue unit and component suites, size, ratchet and
  # sync.
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v1-campaign
    with:
      docs-files: |
        README.md
        packages/dms-builder/README.md
        packages/dms-builder/docs
        packages/interface-dms-builder/README.md
        packages/interface-dms-builder/docs
      docs-typescript-project: packages/interface-dms-builder/docs/tsconfig.json
      renovate-sync: false
    permissions:
      contents: read

  # `ajs dms verify-source`: the production build of the DMS core layer with
  # this one, then vue-tsc. Its own job, so it runs alongside `ci`.
  frontend-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          workspace: "false"

      - run: pnpm --dir packages/dms-builder/frontend-vue typecheck

  # The engine specs write ts-morph fixtures to disk and take minutes: they
  # gate `main` after the merge, not every pull request.
  engine-specs:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DMS_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - run: pnpm --filter @antelopejs/interface-dms-builder build
      - run: pnpm --filter @antelopejs/dms-builder prepack
      - run: pnpm --filter @antelopejs/dms-builder test:unit

  # The single check to require on `main`: it keeps the historical job name,
  # and fails unless every job above succeeded. `skipped` counts as a pass only
  # for engine-specs, which runs on push alone, so a pull request is never left
  # pending.
  ubuntu:
    if: always()
    needs: [ci, frontend-verify, engine-specs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.ci.result == 'skipped' || needs.frontend-verify.result == 'skipped'
        run: exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v1
