name: ci

on:
  push:
    branches:
      - main
  # No branch filter: the lint wave stacks pull requests on top of one another,
  # and filtering on `main` left every intermediate step ungated -- only the
  # secret scanner ran.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Independent jobs instead of one sequence: the wall-clock is the slowest of
# them (verify-source), not their sum.
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The interface is built once, by its own step: the module's `build`
      # would otherwise build it a second time.
      DMS_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Each package's build runs `tsc` over the same tsconfig as its
      # `typecheck` script, so the builds also gate on type errors: oxlint's
      # type-aware pass degrades to `any` on a broken tsconfig without
      # failing, and this is what catches it.
      - run: pnpm --filter @antelopejs/interface-dms-builder build
      - run: pnpm --filter @antelopejs/dms-builder prepack

      - uses: AntelopeJS/tooling-configs/actions/docs@310e3d861b2da2244902854379176c91e1ebc68e
        with:
          files: |
            README.md
            packages/dms-builder/README.md
            packages/dms-builder/docs
            packages/interface-dms-builder/README.md
            packages/interface-dms-builder/docs
          typescript-project: packages/interface-dms-builder/docs/tsconfig.json

      # Package contract, builder switch and query templates, over the
      # compiled `dist`, in one node process tree.
      - run: pnpm --filter @antelopejs/dms-builder test:node

      # Lint and format are shared configs owned by the workspace root.
      - run: pnpm lint
      - run: pnpm --filter @antelopejs/dms-builder knip

  frontend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          workspace: "false"

      - run: pnpm --dir packages/dms-builder/frontend-vue lint
      - run: pnpm --dir packages/dms-builder/frontend-vue test
      # The specs that mount the builder's components, through their own
      # vitest config (it compiles the SFCs).
      - run: pnpm --dir packages/dms-builder/frontend-vue test:components

  # `ajs dms verify-source`: the production build of the DMS core layer with
  # this one, then vue-tsc. The longest job, so nothing else waits on it.
  frontend-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          workspace: "false"

      - run: pnpm --dir packages/dms-builder/frontend-vue typecheck

  # The engine specs write ts-morph fixtures to disk and take minutes: they
  # gate `main` after the merge, not every pull request.
  engine-specs:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DMS_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - run: pnpm --filter @antelopejs/interface-dms-builder build
      - run: pnpm --filter @antelopejs/dms-builder prepack
      - run: pnpm --filter @antelopejs/dms-builder test:unit

  # The single check to require on `main`: it keeps the historical job name,
  # and fails unless every job above succeeded. `skipped` counts as a pass so
  # engine-specs, which only runs on push, never leaves a pull request pending.
  ubuntu:
    if: always()
    needs: [backend, frontend-unit, frontend-verify, engine-specs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || [ "$result" = skipped ] || exit 1
          done
