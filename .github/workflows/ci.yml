name: ci

on:
  push:
    branches:
      - main
  # No branch filter: the lint wave stacks pull requests on top of one another,
  # and filtering on `main` left every intermediate step ungated -- only the
  # secret scanner ran.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Independent jobs instead of one sequence: the wall-clock is the slowest of
# them, not their sum.
jobs:
  # `pnpm run checks`: typecheck, lint (oxlint and the Vue layer's ESLint),
  # format, knip, the node, Vue unit and component suites, size and
  # sync.
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v1-campaign
    with:
      docs-files: |
        README.md
        docs
        packages/dms-builder/README.md
        packages/dms-builder/docs
        packages/interface-dms-builder/README.md
        packages/interface-dms-builder/docs
      docs-typescript-project: packages/interface-dms-builder/docs/tsconfig.json
      renovate-sync: false
      test-job: false
    permissions:
      contents: read

  # `ajs dms verify-source`: the production build of the DMS core layer with
  # this one, then vue-tsc. Its own job, so it runs alongside `ci`.
  frontend-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          workspace: "false"

      - run: pnpm --dir packages/dms-builder/frontend-vue typecheck

  # The engine specs write ts-morph fixtures to disk and take minutes: they run
  # on every pull request as well as on `main`, so a red spec is caught before
  # the merge instead of turning `main` red. Each shard runs its files with
  # `mocha --parallel` (`.mocharc.json`). One rule per shard but the last, which
  # takes every file no rule matches, so a new spec always runs; the rules group
  # the files by their measured duration.
  engine-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DMS_PREBUILT: "1"
      SHARD_RULES: |
        ^table-
        ^(map-resources-(display|label)|draft-queries\.)
        ^(map-resources-(page-options|remap|approval|forgiving)|compose-page)\.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - run: pnpm --filter @antelopejs/interface-dms-builder build
      - run: pnpm --filter @antelopejs/dms-builder prepack
      - working-directory: packages/dms-builder
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          files=$(cd dist/test && ls *.spec.js | sort | awk -v shard="$SHARD" -v total="$TOTAL" '
            BEGIN {
              n = split(ENVIRON["SHARD_RULES"], rule, "\n")
              if (rule[n] == "") n--
              if (n != total - 1) { print "SHARD_RULES has " n " rules for " total " shards" > "/dev/stderr"; exit 1 }
            }
            {
              owner = total
              for (i = 1; i <= n; i++) if ($0 ~ rule[i]) { owner = i; break }
              if (owner == shard) print "dist/test/" $0
            }')
          test -n "$files" || { echo "shard $SHARD runs no spec file" >&2; exit 1; }
          mapfile -t list <<< "$files"
          pnpm exec mocha "${list[@]}"

  # The single check to require on `main`: it keeps the historical job name,
  # and fails unless every job above succeeded; none may be skipped.
  ubuntu:
    if: always()
    needs: [ci, frontend-verify, engine-specs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.ci.result == 'skipped' || needs.frontend-verify.result == 'skipped' || needs.engine-specs.result == 'skipped'
        run: exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v1
